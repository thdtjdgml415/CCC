[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "buywise-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14", "fastapi>=0.115", "psycopg[binary]>=3.2", "pydantic-settings>=2.6", "sqlalchemy>=2.0", "uvicorn[standard]>=0.32"]
[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.8"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["B008"]
[tool.setuptools.packages.find]
include = ["app*"]
